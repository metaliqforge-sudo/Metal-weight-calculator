<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Plate & Sheet Weight Calculator | MetaliqForge</title>
  <meta name="description" content="Calculate theoretical weight of industrial metal plates, sheets, and foils across steel, aluminium, brass, copper, and titanium.">
  <link rel="canonical" href="https://metaliqforge.in/metal-plate-calculator.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex flex-col min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2.5 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-700 flex items-center justify-center text-white shadow-md shadow-sky-500/20 group-hover:scale-105 transition-transform duration-200">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l7 4v6l-7 4-7-4V6z"/>
            <path d="M12 16v6"/>
            <path d="M8 18h8"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-xl font-extrabold tracking-tight text-slate-900 leading-none">
            Metaliq<span class="text-sky-600">Forge</span>
          </span>
          <span class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold mt-0.5">INDUSTRIAL METAL WEIGHT CALCULATOR</span>
        </div>
      </a>

      <div class="flex items-center gap-3">
        <nav class="hidden md:flex items-center space-x-1">
          <a href="index.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-100 transition-colors">Home</a>
          <a href="resources.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-100 transition-colors">Resources</a>
          <a href="articles.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-100 transition-colors">Articles</a>
          <a href="about.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-100 transition-colors">About Us</a>
          <a href="contact.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-100 transition-colors">Contact Us</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-100 pb-4 mb-6 gap-3">
        <div>
          <span class="text-xs uppercase font-mono tracking-widest text-indigo-600 font-semibold block">Flat Sheet & Plate Section</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Metal Plate & Sheet Calculator</h1>
        </div>
        <div class="inline-flex p-1 bg-slate-100 rounded-xl text-xs font-bold text-slate-600 self-start sm:self-auto">
          <button id="btnMetric" onclick="setUnit('metric')" class="px-3.5 py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm transition-all">Metric (mm)</button>
          <button id="btnImperial" onclick="setUnit('imperial')" class="px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all">Imperial (inch)</button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Material & Density</label>
          <select id="plateMat" onchange="calcPlate()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="7.85">MS / Carbon Steel (7.85 g/cm³)</option>
            <option value="8.00">Stainless Steel 304 / 316 (8.00 g/cm³)</option>
            <option value="2.70">Aluminium (2.70 g/cm³)</option>
            <option value="8.50">Brass (8.50 g/cm³)</option>
            <option value="8.96">Copper (8.96 g/cm³)</option>
            <option value="4.51">Titanium (4.51 g/cm³)</option>
            <option value="7.14">Zinc (7.14 g/cm³)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" id="lblLen">Length (mm)</label>
          <input type="number" id="plateLen" value="1000" min="0.01" step="any" oninput="calcPlate()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" id="lblWid">Width (mm)</label>
          <input type="number" id="plateWid" value="1000" min="0.01" step="any" oninput="calcPlate()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" id="lblThick">Thickness (mm)</label>
          <input type="number" id="plateThick" value="5" min="0.01" step="any" oninput="calcPlate()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Quantity (Pcs)</label>
          <input type="number" id="plateQty" value="1" min="1" step="1" oninput="calcPlate()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <div class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-2xl p-6 text-center shadow-lg">
        <span class="text-xs uppercase text-indigo-300 font-bold tracking-wider">Calculated Theoretical Plate Weight</span>
        <div class="grid grid-cols-2 gap-4 mt-3">
          <div class="bg-white/5 rounded-xl p-3 border border-white/10">
            <div class="text-xs text-slate-400">Total (kg)</div>
            <div class="text-2xl sm:text-3xl font-black text-white font-mono mt-1" id="plateResultKg">~ 39.25 kg</div>
          </div>
          <div class="bg-white/5 rounded-xl p-3 border border-white/10">
            <div class="text-xs text-slate-400">Total (lbs)</div>
            <div class="text-2xl sm:text-3xl font-black text-indigo-300 font-mono mt-1" id="plateResultLbs">~ 86.53 lbs</div>
          </div>
        </div>
        <div class="mt-3 text-[11px] text-slate-400 font-mono" id="plateDetails">Per Piece: ~ 39.25 kg | Volume: 5000.00 cm³</div>
      </div>
    </div>
  </main>

  <script>
    let currentUnit = 'metric';
    const KG_TO_LBS = 2.20462262;

    function setUnit(unit) {
      if (currentUnit === unit) return;
      currentUnit = unit;
      const btnMetric = document.getElementById('btnMetric');
      const btnImperial = document.getElementById('btnImperial');
      const lEl = document.getElementById('plateLen');
      const wEl = document.getElementById('plateWid');
      const tEl = document.getElementById('plateThick');

      if (unit === 'imperial') {
        btnImperial.className = "px-3.5 py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm transition-all";
        btnMetric.className = "px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all";
        document.getElementById('lblLen').textContent = "Length (inch)";
        document.getElementById('lblWid').textContent = "Width (inch)";
        document.getElementById('lblThick').textContent = "Thickness (inch)";
        lEl.value = (parseFloat(lEl.value) / 25.4).toFixed(2);
        wEl.value = (parseFloat(wEl.value) / 25.4).toFixed(2);
        tEl.value = (parseFloat(tEl.value) / 25.4).toFixed(3);
      } else {
        btnMetric.className = "px-3.5 py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm transition-all";
        btnImperial.className = "px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all";
        document.getElementById('lblLen').textContent = "Length (mm)";
        document.getElementById('lblWid').textContent = "Width (mm)";
        document.getElementById('lblThick').textContent = "Thickness (mm)";
        lEl.value = (parseFloat(lEl.value) * 25.4).toFixed(0);
        wEl.value = (parseFloat(wEl.value) * 25.4).toFixed(0);
        tEl.value = (parseFloat(tEl.value) * 25.4).toFixed(1);
      }
      calcPlate();
    }

    function calcPlate() {
      const d = parseFloat(document.getElementById('plateMat').value) || 7.85;
      let l = parseFloat(document.getElementById('plateLen').value) || 0;
      let w = parseFloat(document.getElementById('plateWid').value) || 0;
      let t = parseFloat(document.getElementById('plateThick').value) || 0;
      const qty = parseInt(document.getElementById('plateQty').value) || 1;

      if (l <= 0 || w <= 0 || t <= 0 || qty <= 0) return;

      let l_mm = currentUnit === 'imperial' ? l * 25.4 : l;
      let w_mm = currentUnit === 'imperial' ? w * 25.4 : w;
      let t_mm = currentUnit === 'imperial' ? t * 25.4 : t;

      const vol_cm3 = (l_mm * w_mm * t_mm) / 1000.0;
      const single_kg = (vol_cm3 * d) / 1000.0;
      const total_kg = single_kg * qty;

      document.getElementById('plateResultKg').textContent = `~ ${total_kg.toFixed(2)} kg`;
      document.getElementById('plateResultLbs').textContent = `~ ${(total_kg * KG_TO_LBS).toFixed(2)} lbs`;
      document.getElementById('plateDetails').textContent = `Per Piece: ~ ${single_kg.toFixed(2)} kg | Volume: ${vol_cm3.toFixed(2)} cm³`;
    }

    window.addEventListener('DOMContentLoaded', calcPlate);
  </script>
</body>
</html>
